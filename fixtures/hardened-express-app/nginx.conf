# Starter reverse-proxy config (operator installs, adds TLS, reloads). App is published on 127.0.0.1:3000 only.
limit_req_zone  $binary_remote_addr zone=perip:10m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=connperip:10m;
upstream app { server 127.0.0.1:3000; keepalive 16; }
server {
  listen 80;  # add `listen 443 ssl;` + certificates; redirect 80 -> 443
  server_tokens off;
  client_max_body_size 6m;  client_body_timeout 10s;  client_header_timeout 10s;  send_timeout 10s;  keepalive_timeout 30s;
  limit_conn connperip 20;
  proxy_http_version 1.1;  proxy_set_header Connection "";
  proxy_set_header Host $host;  proxy_set_header X-Forwarded-For $remote_addr;  proxy_set_header X-Forwarded-Proto $scheme;
  location /api/ { limit_req zone=perip burst=20 nodelay; limit_req_status 429; proxy_read_timeout 30s; proxy_pass http://app; }
  location = /api/login { limit_req zone=login burst=3 nodelay; limit_req_status 429; proxy_pass http://app; }
  location /uploads/ { alias /srv/app-uploads/; add_header X-Content-Type-Options nosniff always; add_header Content-Security-Policy "default-src 'none'" always; types { image/png png; image/jpeg jpg; image/gif gif; image/webp webp; } default_type application/octet-stream; }
  location / { proxy_pass http://app; }
  location ~ /\. { deny all; }
}
